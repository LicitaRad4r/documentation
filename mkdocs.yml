site_name: LicitaRadar — Documentação
site_url: https://licitarad4r.github.io/documentation/
repo_url: https://github.com/LicitaRad4r/documentation
docs_dir: docs

theme:
  name: material
  language: pt-BR
  font:
    text: Montserrat
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Modo escuro }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Modo claro }
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.class

nav:
  - Início: index.md
  - Gestão e Metodologia:
    - Cronograma e Sprints: gestao_metodologia/Cronograma.md
    - Definition of Done: gestao_metodologia/definition-of-done.md
    - Equipe e Comunicação: gestao_metodologia/equipedesenvolvedora.md
  - Decisões Técnicas (ADRs): adrs/decisoes_tecnicas.md
  - Arquitetura: architecture/Arquitetura.md
  - Produto:
    - Jornadas de Utilizador: requirements/produto/jornadas.md
    - Visão do Produto:
      - Visão Geral: requirements/produto/negocio/visao/visao_geral.md
      - Escopo e Impacto: requirements/produto/negocio/visao/impacto.md
      - Viabilidade: requirements/produto/negocio/visao/viabilidade.md
      - Personas: requirements/produto/negocio/visao/personas.md
    - Regras de Negócio:
      - Score de Aderência: requirements/produto/negocio/Regradenegocio/score.md
      - Filtros: requirements/produto/negocio/Regradenegocio/filtros.md
    - Requisitos:
      - Matriz MoSCoW: requirements/produto/requisitos/MoSCoW.md
      - Requisitos Funcionais: requirements/produto/requisitos/requisitosfuncionais.md
      - Requisitos Não Funcionais: requirements/produto/requisitos/naofuncionais.md
      - Histórias de Usuário: requirements/produto/requisitos/historias.md
  - Testes:
    - Estratégia de Testes: Testes/estrategia_de_testes.md
    - Critérios Prioritários: Testes/criterios-prioritarios.md
    - EP BVA v1: Testes/ep-bva-v1.md
    - Relatório dos Testes: Testes/relatorio-testes.md
    - Matriz de Rastreabilidade: Testes/matriz-rastreabilidade
    
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
