site_name: LicitaRadar — Documentation
site_url: https://licitarad4r.github.io/documentation/
repo_url: https://github.com/LicitaRad4r/documentation
docs_dir: docs

theme:
  name: material
  language: pt-BR
  font:
    text: Montserrat
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Modo escuro }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Modo claro }
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Início: index.md

  - Produto:
    - Visão do Produto:
      - Visão Geral: requirements/produto/negocio/visao/visao_geral.md
      - Impacto: requirements/produto/negocio/visao/impacto.md
      - Viabilidade: requirements/produto/negocio/visao/viabilidade.md
      - Personas: requirements/produto/negocio/visao/personas.md
    - Escopo do MVP: requirements/produto/negocio/visao/escopo.md
    - Jornadas de Utilizador: requirements/produto/jornadas.md
    - Requisitos:
      - Requisitos Funcionais: requirements/produto/requisitos/requisitosfuncionais.md
      - Requisitos Não Funcionais: requirements/produto/requisitos/naofuncionais.md
    - Regras de Negócio:
      - Score de Aderência: requirements/produto/negocio/Regradenegocio/score.md
      - Filtros: requirements/produto/negocio/Regradenegocio/filtros.md

  - Arquitetura:
    - Arquitetura Geral: architecture/Arquitetura.md
    - Decisões Técnicas (ADRs): architecture/decisoes_tecnicas.md
    - Back-End: architecture/backend.md
    - Front-End: architecture/frontend.md
    - Banco de Dados: architecture/banco-de-dados.md
    - Infraestrutura e Segurança:
      - Infraestrutura: architecture/InfraestruturaeSegurança/infraestrutura.md
      - Logs de Segurança: architecture/InfraestruturaeSegurança/logs-seguranca.md

  - Backlog:
    - Histórias de Usuário: backlog/historias.md
    - Matriz MoSCoW: backlog/MoSCoW.md
    - Backlog do CP2: backlog/backlogcp2.md
    - Revisões do Backlog: backlog/revisoes-backlog.md

  - Qualidade e Testes:
    - Estratégia de Testes: Testes/estrategia_de_testes.md
    - Critérios Prioritários: Testes/criterios-prioritarios.md
    - EP/BVA v1: Testes/ep-bva-v1.md
    - Matriz de Rastreabilidade: Testes/matriz-rastreabilidade.md
    - Relatório de Testes (CP2): Testes/relatoriocp2.md
    - Roteiro E2E (API real): Testes/roteiro-e2e-api-real.md

  - FinOps (custo zero):
    - Visão geral: architecture/finops/README.md
    - Evidências: architecture/finops/evidencias/README.md

  - Gestão e Metodologia:
    - Como rodar localmente: gestao_metodologia/como-rodar.md
    - Cronograma e Sprints: gestao_metodologia/Cronograma.md
    - Histórico de Sprints:
      - Semana 1: gestao_metodologia/historicosprints/semana1.md
      - Semana 2: gestao_metodologia/historicosprints/semana2.md
      - Semana 3: gestao_metodologia/historicosprints/semana3.md
      - Semana 4: gestao_metodologia/historicosprints/semana4.md
      - Semana 5: gestao_metodologia/historicosprints/semana5.md
      - Semana 6: gestao_metodologia/historicosprints/semana6.md
    - Definition of Ready: gestao_metodologia/Metodologia_Tempo/definition-of-ready.md
    - Definition of Done: gestao_metodologia/Metodologia_Tempo/definition-of-done.md
    - Equipe e Comunicação: gestao_metodologia/equipedesenvolvedora.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
